# Supabase pausa los proyectos gratis que pasan una semana sin actividad.
# Esta tarea hace una consulta mínima cada 3 días para mantenerlo despierto.
# También hace un pequeño commit una vez al mes, porque GitHub apaga las tareas
# programadas de repos que pasan 60 días sin cambios.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar la base de datos
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js || true)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase todavía no está configurado; nada que hacer."
            exit 0
          fi
          curl -sS --fail -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase respondió."

      - name: Commit mensual para que GitHub no apague esta tarea
        run: |
          ULTIMO=$(git log -1 --format=%ct)
          AHORA=$(date +%s)
          if [ $((AHORA - ULTIMO)) -gt 2160000 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/ultimo-ping.txt
            git config user.name "rojito-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ultimo-ping.txt
            git commit -m "Mantener activa la tarea programada"
            git push
          fi
