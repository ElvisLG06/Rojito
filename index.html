  <!-- Pantalla de carga: va aquí dentro para que se pinte al instante, antes que todo lo demás -->
  <style>
    html, body { margin: 0; background: #F4F1EE; }
    .cargando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #F4F1EE; z-index: 100; }
    .cargando img { width: 120px; height: 120px; border-radius: 28px; animation: latido 1.2s ease-in-out infinite; }
    @keyframes latido { 50% { transform: scale(0.94); opacity: 0.75; } }
  </style>
